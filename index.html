<script>


  /* =====================================================
     TODO LO QUE SE ESCRIBA EN MAYÚSCULAS
     ===================================================== */

  document
    .querySelectorAll('input[type="text"]')
    .forEach(campo => {

      campo.addEventListener(
        'input',
        function () {

          this.value =
            this.value.toUpperCase();

        }
      );

    });


  /* =====================================================
     CÓDIGO DE BARRAS
     ===================================================== */

  window.actualizarCodigoBarras = function () {

    const inputQ8 =
      document
        .getElementById('q8')
        .value
        .trim()
        .toUpperCase()
        .replace(/\s+/g, '');

    const container =
      document.getElementById(
        'barcode-container'
      );


    if (inputQ8) {

      container.style.display =
        'block';

      container.classList.remove(
        'barcode-visible'
      );

      void container.offsetWidth;

      container.classList.add(
        'barcode-visible'
      );


      JsBarcode(
        "#barcode",
        inputQ8,
        {

          format: "CODE128",

          lineColor: "#000",

          width: 2,

          height: 60,

          displayValue: true,

          fontSize: 18

        }
      );

    } else {

      container.style.display =
        'none';

    }

  };


  /* =====================================================
     COMPARTIR IMAGEN
     ===================================================== */

  window.compartirImagen =
    async function () {

      const img =
        document.getElementById(
          'barcode'
        );


      if (
        !img.src ||
        !img.src.startsWith(
          'data:image'
        )
      ) {

        alert(
          'Primero debes generar el código de barras.'
        );

        return;
      }


      try {

        const response =
          await fetch(img.src);

        const blob =
          await response.blob();


        const file =
          new File(
            [blob],
            'codigo_alfanumerico.png',
            {
              type: blob.type
            }
          );


        if (
          navigator.canShare &&
          navigator.canShare({
            files: [file]
          })
        ) {

          await navigator.share({

            title:
              'Código Alfanumérico',

            files: [file]

          });

        } else {

          alert(
            'Tu navegador no soporta esta función directa. ' +
            'Por favor, intenta en Google Chrome o Safari.'
          );

        }


      } catch (error) {

        console.error(
          'Error al compartir:',
          error
        );

      }

    };


  /* =====================================================
     WHATSAPP ALFANUMÉRICO
     ===================================================== */

  window.enviarAlfanumericoSolo =
    function () {

      const inputQ8 =
        document
          .getElementById('q8')
          .value
          .trim()
          .toUpperCase()
          .replace(/\s+/g, '');


      if (inputQ8) {

        const numeroSecundario =
          '525529858210';


        const mensaje =
          `Código Alfanumérico: ${inputQ8}`;


        const url =
          `https://wa.me/${numeroSecundario}?text=${encodeURIComponent(mensaje)}`;


        window.open(
          url,
          '_blank'
        );


      } else {

        alert(
          'Por favor, ingresa o dicta el código alfanumérico primero.'
        );

      }

    };


  /* =====================================================
     ACTUALIZAR CÓDIGO AL ESCRIBIR
     ===================================================== */

  document
    .getElementById('q8')
    .addEventListener(
      'input',
      window.actualizarCodigoBarras
    );


  /* =====================================================
     RECONOCIMIENTO DE VOZ
     ===================================================== */

  window.dictar =
    function (idCampo, btn) {


      if (
        !('webkitSpeechRecognition' in window)
      ) {

        alert(
          'Tu navegador no soporta reconocimiento de voz. ' +
          'Usa Google Chrome.'
        );

        return;
      }


      const recognition =
        new webkitSpeechRecognition();


      recognition.lang =
        'es-MX';


      recognition.interimResults =
        false;


      recognition.maxAlternatives =
        1;


      const restaurarBoton =
        () => {

          btn.innerText =
            'Dictar';

          btn.classList.remove(
            'listening'
          );

        };


      recognition.onstart =
        () => {

          btn.innerText =
            'Escuchando...';

          btn.classList.add(
            'listening'
          );

        };


      recognition.onerror =
        (event) => {

          alert(
            'Error al reconocer la voz: ' +
            event.error
          );

          restaurarBoton();

        };


      recognition.onend =
        () => {

          restaurarBoton();

        };


      recognition.onresult =
        (event) => {

          let texto =

          if (

    function () {

        inputOtro.removeAttribute(

        );

          '';

      actualizarProgreso();

  const campos =

        function (e) {

            ) {

            }

          }

        }
      );

  /* =====================================================

    'q7',

    'q9',

  ];


  function actualizarProgreso() {

    let completados = 0;


    camposProgreso.forEach(
      id => {

        const campo =
          document.getElementById(
            id
          );


        if (
          campo &&
          campo.value.trim() !== ''
        ) {

          completados++;

        }

      }
    );


    const porcentaje =
      Math.max(
        10,
        completados * 10
      );


    document
      .getElementById(
        'progress-fill'
      )
      .style.width =
      porcentaje + '%';


    document
      .getElementById(
        'progress-number'
      )
      .textContent =
      completados + ' / 10';

  /* Detectar cambios */

  camposProgreso.forEach(

      const campo =
        document.getElementById(
          id
        );


      if (campo) {

        campo.addEventListener(
          'input',
          actualizarProgreso
        );

        campo.addEventListener(
          'change',
          actualizarProgreso
        );
